# The two sites, and the API behind both of them.
#
# One nginx, two server blocks, told apart by Host. They cannot share a
# hostname and be told apart by path: the refresh cookie is set with
# `path=/api/v1/auth` and `SameSite=Lax`, so each app has to reach the API on
# its own origin, and an admin served at /admin would send its cookie to the
# public site as well.
#
# TLS is not here. Something on the host terminates it and forwards to this
# container, passing the original Host through — which is what picks the
# server block below.

# No `upstream` block here on purpose — see minna-api.inc for why the API is
# addressed through a variable instead.

# Whether this request is a link preview rather than a reader.
#
# The public site is a single-page app: the HTML that arrives is nearly empty
# and Vue fills it in. These services do not run JavaScript, so every shared
# link previewed as the same blank page whatever it pointed at. They are sent
# to the API instead, which answers with the tags they came for.
#
# Matched on user agent, which is a claim rather than a fact — but the worst a
# liar gets is a page of their own public metadata, so there is nothing here
# to protect.
map $http_user_agent $minna_is_crawler {
    default                         0;
    "~*facebookexternalhit"         1;
    "~*Facebot"                     1;
    "~*Twitterbot"                  1;
    "~*linkedinbot"                 1;
    "~*Slackbot"                    1;
    "~*Discordbot"                  1;
    "~*WhatsApp"                    1;
    "~*TelegramBot"                 1;
    # LINE sends two different ones depending on where the link was opened.
    "~*line-poker"                  1;
    "~*Line/"                       1;
    "~*Pinterest"                   1;
    "~*redditbot"                   1;
    "~*Google-InspectionTool"       1;
}

# Anything arriving under a hostname we do not serve. Without this, nginx
# hands the first block to every unknown Host, and the admin would answer to
# whatever name happened to resolve here.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# www, sent to the apex rather than served.
#
# Answering on both would put the same pages at two addresses, and the app
# writes its own canonical links from APP_URL — so a reader arriving at www
# would be shown a page that tells search engines it lives somewhere else.
# One permanent redirect settles it, and costs nothing if the record is
# never created.
server {
    listen 80;
    server_name www.learnotive.com;
    return 301 https://learnotive.com$request_uri;
}

# ------------------------------------------------------------------
# The public site
# ------------------------------------------------------------------
server {
    listen 80;
    server_name learnotive.com;
    charset utf-8;

    # Uploads go straight to space-kim with a signed ticket, so nothing large
    # passes through here. This is headroom for the admin's editor images.
    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Not SAMEORIGIN-only: the site is never meant to be framed at all.
    add_header X-Frame-Options "DENY" always;

    include /etc/nginx/conf.d/minna-api.inc;
    include /etc/nginx/conf.d/minna-og.inc;

    location / {
        # A crawler gets the metadata page; everybody else gets the app. The
        # named location is reached only through the map above, so a reader's
        # request never pays for the test beyond one variable lookup.
        if ($minna_is_crawler) {
            rewrite ^ /__og$uri last;
        }
        root /var/www/site;
        try_files $uri $uri/ /index.html;
    }

    # Hashed names: the file changes name when its contents change, so the old
    # one is never asked for again and this can be cached for as long as the
    # browser likes.
    #
    # `expires` rather than `add_header Cache-Control`, here and below. An
    # add_header in a location replaces every add_header inherited from the
    # server — nginx does not merge them — so writing the cache policy that
    # way would quietly drop the three security headers above from exactly the
    # files most worth sending them with. `expires` is its own directive and
    # leaves the inherited ones alone.
    location /assets/ {
        root /var/www/site;
        access_log off;
        expires 1y;
    }

    # The one file that must never be served from cache: it names the hashed
    # assets, so a stale copy sends the browser looking for the last release's
    # files. `-1` means no-cache — fetch it again and let nginx answer 304 when
    # it really has not changed.
    location = /index.html {
        root /var/www/site;
        expires -1;
    }
}

# ------------------------------------------------------------------
# The admin
#
# One label deep, not `admin.minna.learnotive.com`, and that is not cosmetic.
# Cloudflare's free certificate covers `learnotive.com` and
# `*.learnotive.com`, and a wildcard matches a single label — so a name two
# deep has no certificate at the edge and the TLS handshake fails before any
# of this is reached. The site looked fine and the admin was simply
# unreachable.
#
# Anything moving this back under another label needs a certificate that names
# it: Cloudflare's Advanced Certificate Manager, or one on the origin.
# ------------------------------------------------------------------
server {
    listen 80;
    server_name admin.learnotive.com;
    charset utf-8;

    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Staff pages have no business in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/conf.d/minna-api.inc;

    location / {
        root /var/www/admin;
        try_files $uri $uri/ /index.html;
    }

    # Same reasoning as the public site above: `expires`, not add_header, so
    # the security headers are not dropped.
    location /assets/ {
        root /var/www/admin;
        access_log off;
        expires 1y;
    }

    location = /index.html {
        root /var/www/admin;
        expires -1;
    }
}

# Used by the container's healthcheck, which arrives with no Host worth
# matching and so lands on the default server above — hence its own block.
server {
    listen 80;
    server_name 127.0.0.1 localhost;
    access_log off;

    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}
