# The host's vhost — goes on the server, not in any image.
#
#   /etc/nginx/sites-available/minna-v2
#   ln -s /etc/nginx/sites-available/minna-v2 /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# This is the nginx already on the server, in front of everything. It hands
# the request to the container on 127.0.0.1:8096, and the nginx *inside* that
# container picks between the public site and the admin — see
# docker/nginx/minna.prod.conf.
#
# Port 80 only, no certificate. TLS is terminated at Cloudflare, which is how
# every other site on this server is set up (api.learnsabuy.com has no
# ssl_certificate either). Nothing here has to know about certificates, and
# nothing here renews one.
#
# Kept in the repo rather than only in DEPLOY.md because it is the one piece
# of the deployment living outside the images, and so the one piece with no
# other record of what it is supposed to say.
#
# Both hostnames are served by one block on purpose. They differ only in which
# static files they get, and that decision is made inside the container.

# What the visitor's connection to Cloudflare actually was.
#
# `$scheme` is http here and always will be — Cloudflare reaches this server
# over plain http — so passing $scheme on would tell the API that a visitor on
# https arrived over http. Cloudflare states the real one in this header, so
# that is what gets forwarded, with $scheme only as a fallback for a request
# that somehow arrived without it.
map $http_x_forwarded_proto $minna_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    listen [::]:80;
    server_name minna.learnsbuy.com minna-admin.learnsbuy.com;

    # Matches the container's own limit, so a file that is going to be refused
    # is refused here rather than after a full upload.
    client_max_body_size 25M;

    access_log /var/log/nginx/minna-v2.access.log;
    error_log  /var/log/nginx/minna-v2.error.log;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;

        # The one header that must not be dropped. Inside the container it is
        # the only thing telling the public site from the admin; without it
        # every request lands on the catch-all block and the connection closes
        # with no reply at all.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $minna_proto;

        # Chat and the payment-waiting page hold a connection open and read it
        # as it arrives. Buffering collects the whole stream and delivers
        # nothing until it ends — which, for a stream that never ends, means
        # delivering nothing.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# ---------------------------------------------------------------------------
# Optional, and worth doing: the visitor's real address.
#
# Every request arrives from a Cloudflare address, so without this the API
# logs, the audit trail and anything that counts attempts per address all see
# Cloudflare rather than the person. Adding it means `$remote_addr` becomes
# the real client again.
#
# The list of Cloudflare ranges changes; fetch the current one rather than
# copying it from anywhere. The `echo` between the two is load-bearing —
# neither list ends in a newline, so without it the last IPv4 range and the
# first IPv6 range arrive joined into one unparseable line and nginx refuses
# to start:
#
#   { curl -s https://www.cloudflare.com/ips-v4; echo; \
#     curl -s https://www.cloudflare.com/ips-v6; echo; } \
#     | sed '/^[[:space:]]*$/d; s/^/set_real_ip_from /; s/$/;/' \
#     > /etc/nginx/conf.d/cloudflare-realip.conf
#   echo 'real_ip_header CF-Connecting-IP;' >> /etc/nginx/conf.d/cloudflare-realip.conf
#   nginx -t && systemctl reload nginx
#
# It applies to every site on this server at once, which is why it belongs in
# conf.d rather than in here.
# ---------------------------------------------------------------------------
